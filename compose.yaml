services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET}
    ports:
      - "8082:8080"
    volumes:
      - ../authentication-service/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-shopper}
      POSTGRES_USER: ${USER_DB_USERNAME:-shopper}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-shopper}
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${USER_DB_USERNAME:-shopper} -d ${USER_DB_NAME:-shopper}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_service}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-order_service}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_service}
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ORDER_DB_USERNAME:-order_service} -d ${ORDER_DB_NAME:-order_service}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  user-service:
    build:
      context: ../shopper/user-service
      dockerfile: Dockerfile
    image: user-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${USER_DB_NAME:-shopper}
      POSTGRES_USER: ${USER_DB_USERNAME:-shopper}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-shopper}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/shopper
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  authentication-service:
    build:
      context: ../authentication-service
      dockerfile: Dockerfile
    image: authentication-service:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: shopper
      KEYCLOAK_CLIENT_ID: authentication-service
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET}

      USER_SERVICE_URL: http://user-service:8080

      HTTP_CONNECT_TIMEOUT: 3s
      HTTP_READ_TIMEOUT: 10s
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    image: order-service:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

      DB_HOST: order-db
      DB_PORT: "5432"
      DB_NAME: ${ORDER_DB_NAME:-order_service}
      DB_USERNAME: ${ORDER_DB_USERNAME:-order_service}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_service}

      SERVER_PORT: "8083"

      JWT_ISSUER_URI: http://keycloak:8080/realms/shopper
      JWT_JWK_SET_URI: http://keycloak:8080/realms/shopper/protocol/openid-connect/certs
      JWT_AUDIENCE: order-service
    ports:
      - "8083:8083"
    depends_on:
      order-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-gateway:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

      SERVER_PORT: "8080"

      AUTH_SERVICE_URL: http://authentication-service:8081
      USER_SERVICE_URL: http://user-service:8080
      ORDER_SERVICE_URL: http://order-service:8083

      JWT_ISSUER_URI: http://keycloak:8080/realms/shopper
      JWT_JWK_SET_URI: http://keycloak:8080/realms/shopper/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      authentication-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    restart: unless-stopped

volumes:
  keycloak-db-data:
  user-db-data:
  redis-data:
  order-db-data:
