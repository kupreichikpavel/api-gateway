services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${KEYCLOAK_DB_USERNAME:-keycloak} -d ${KEYCLOAK_DB_NAME:-keycloak}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - keycloak-internal
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET}
    volumes:
      - ../authentication-service/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app-network
      - keycloak-internal
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-shopper}
      POSTGRES_USER: ${USER_DB_USERNAME:-shopper}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-shopper}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${USER_DB_USERNAME:-shopper} -d ${USER_DB_NAME:-shopper}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - user-internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - user-internal
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_service}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-order_service}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_service}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ORDER_DB_USERNAME:-order_service} -d ${ORDER_DB_NAME:-order_service}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - order-internal
    restart: unless-stopped

  user-service:
    build:
      context: ../shopper/user-service
      dockerfile: Dockerfile
    image: user-service:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${USER_DB_NAME:-shopper}
      POSTGRES_USER: ${USER_DB_USERNAME:-shopper}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-shopper}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-network
      - user-internal
    restart: unless-stopped

  authentication-service:
    build:
      context: ../authentication-service
      dockerfile: Dockerfile
    image: authentication-service:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: authentication-service
      AUTH_SERVICE_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET}
      USER_SERVICE_URL: http://user-service:8080
      HTTP_CONNECT_TIMEOUT: 3s
      HTTP_READ_TIMEOUT: 10s
    depends_on:
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    image: order-service:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DB_HOST: order-db
      DB_PORT: "5432"
      DB_NAME: ${ORDER_DB_NAME:-order_service}
      DB_USERNAME: ${ORDER_DB_USERNAME:-order_service}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_service}
      SERVER_PORT: "8083"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI}
      JWT_AUDIENCE: order-service
    depends_on:
      order-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - app-network
      - order-internal
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-gateway:local
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: "8080"
      AUTH_SERVICE_URL: http://authentication-service:8081
      USER_SERVICE_URL: http://user-service:8080
      ORDER_SERVICE_URL: http://order-service:8083
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI}
    ports:
      - "8080:8080"
    depends_on:
      authentication-service:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  keycloak-db-data:
  user-db-data:
  redis-data:
  order-db-data:

networks:
  app-network:
    driver: bridge

  keycloak-internal:
    driver: bridge
    internal: true

  user-internal:
    driver: bridge
    internal: true

  order-internal:
    driver: bridge
    internal: true
